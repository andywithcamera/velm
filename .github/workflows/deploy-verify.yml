name: Deploy verification

# Why (#191): Railway silently skips a build when the CI check suite for the
# commit is not green — a CodeQL job failing on disk space is enough — and still
# reports the deployment to GitHub as a success. The only place that can notice
# is the deployed site itself, so every successful deployment is checked
# against what https://velm.dev/version actually serves.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA that should be serving on velm.dev
        required: true

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-verify-${{ github.event.deployment.sha || inputs.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # A deployment that failed or is still running is Railway's business; this
    # guard exists for the ones that claim success.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (contains(github.event.deployment.environment, 'production') ||
        contains(github.event.deployment.environment, 'velm')))
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Verify velm.dev serves the deployed commit
        id: verify
        env:
          SHA: ${{ github.event.deployment.sha || inputs.sha }}
          VERIFY_ATTEMPTS: "18"
          VERIFY_INTERVAL: "20"
        run: sh scripts/verify-deploy.sh "$SHA"

      # A skip that is only visible in a workflow log is still silent to anyone
      # watching the commit. Report the outcome as a commit status so a branch
      # and a PR show it, and so the cause is readable without opening the
      # Railway deployment card.
      - name: Report the outcome on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha || inputs.sha }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            state=success
            description="velm.dev is serving $SHA"
          else
            state=failure
            description="Deploy did not reach production: velm.dev is not serving $SHA (Railway skips the build when CI is not green)"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" \
            -f context="deploy/velm.dev" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
