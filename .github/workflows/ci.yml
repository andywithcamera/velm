name: Go CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt on changed Go files
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            # Fetch the base branch in full. A depth-limited fetch grafts the base
            # tip with its parents cut, so `base...HEAD` fails with "no merge base"
            # as soon as the base branch moves past the branch point — which every
            # PR that sits for review eventually hits. The checkout already pulls
            # full history for HEAD, so this shares nearly all objects.
            git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # A force-push can name a commit this runner has never seen.
            if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
              base="${{ github.event.before }}"
            else
              echo "Commit ${{ github.event.before }} is not present locally; checking every Go file."
            fi
          fi

          if [ -z "$base" ]; then
            files="$(git ls-files '*.go')"
          elif ! files="$(git diff --name-only --diff-filter=ACMRT "$base...HEAD" -- '*.go' 2>/dev/null)"; then
            # No merge base. A two-dot diff yields the same file set for the
            # purpose of a format check, so fall back rather than fail with a
            # message that says nothing about formatting.
            echo "No merge base with $base; falling back to a two-dot diff."
            files="$(git diff --name-only --diff-filter=ACMRT "$base..HEAD" -- '*.go')"
          fi

          if [ -z "$files" ]; then
            echo "No Go files changed."
            exit 0
          fi

          unformatted="$(printf '%s\n' "$files" | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...
